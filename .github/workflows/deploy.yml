name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo, write the site, and mint an OIDC token
# for the deploy step.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A push that lands mid-run cancels the older one
# rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Requires package-lock.json to be committed. `npm install` once
      # locally creates it.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Type-checks first, then builds: `npm run build` is tsc --noEmit && vite build.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
